<g id="mouse_fmt">
  <defs>
    <filter id="mouse_fmt-glow" x="-0.5" y="-0.5" width="2" height="2">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="mouse_fmt-soft" x="-0.3" y="-0.3" width="1.6" height="1.6">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <linearGradient id="mouse_fmt-poopBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e4618"/>
      <stop offset="0.3" stop-color="#946630"/>
      <stop offset="0.62" stop-color="#7a5020"/>
      <stop offset="1" stop-color="#4e3012"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-poopMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a0704a"/>
      <stop offset="0.5" stop-color="#8a5622"/>
      <stop offset="1" stop-color="#6a4016"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-poopTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6250"/>
      <stop offset="0.5" stop-color="#a87e66"/>
      <stop offset="1" stop-color="#8e5c34"/>
    </linearGradient>
    <radialGradient id="mouse_fmt-poopHi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c49a62" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c49a62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mouse_fmt-bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666a6d"/>
      <stop offset="0.5" stop-color="#5c5b5f"/>
      <stop offset="0.85" stop-color="#4a474a"/>
      <stop offset="1" stop-color="#3a3739"/>
    </linearGradient>
    <radialGradient id="mouse_fmt-bodyHi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a7e80" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7a7e80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mouse_fmt-earG" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#dc9cae"/>
      <stop offset="0.55" stop-color="#bf8293"/>
      <stop offset="1" stop-color="#9a6474"/>
    </radialGradient>
    <linearGradient id="mouse_fmt-tailG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ab9ca8"/>
      <stop offset="1" stop-color="#857784"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-barrelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94b6cc"/>
      <stop offset="0.35" stop-color="#e2f4ff"/>
      <stop offset="0.7" stop-color="#cfe2f0"/>
      <stop offset="1" stop-color="#7f98ae"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-liqG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6d6ea"/>
      <stop offset="0.5" stop-color="#6aa2bc"/>
      <stop offset="1" stop-color="#3c6a84"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-flangeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36588c"/>
      <stop offset="0.5" stop-color="#5c7eaa"/>
      <stop offset="1" stop-color="#2c4466"/>
    </linearGradient>
    <radialGradient id="mouse_fmt-bulbG" cx="0.3" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#86aae6"/>
      <stop offset="0.45" stop-color="#4c74b8"/>
      <stop offset="1" stop-color="#1e3a66"/>
    </radialGradient>
  </defs>

  <!-- soft whitish halos (the original vignette icons sit on faint white glows) -->
  <g filter="url(#mouse_fmt-glow)" opacity="0.8">
    <ellipse cx="89" cy="206" rx="7" ry="6" fill="#fbf8ea"/>
    <ellipse cx="107" cy="215" rx="6.5" ry="4.5" fill="#fdf6fb"/>
    <ellipse cx="129" cy="218.6" rx="13" ry="3" fill="#faf3f8"/>
  </g>

  <!-- poop -->
  <g id="mouse_fmt-poop">
    <path d="M85.6 215.6 C82.4 214.8 82.4 210.8 84.8 209.9 L85.9 209.7 C85.1 208.4 85.5 206.6 87.6 206.1 L88.1 205.9 C88.6 204.5 90.6 203.1 92.2 202.6 C92.9 202.3 93.2 201.9 93.4 201.6 C95 202.1 95.4 204 95.2 205.9 L95.6 206.1 C97.2 206.8 97.2 209 96.4 209.8 L96.8 209.9 C98.8 210.8 98.9 214 95.6 215.6 C92.6 216.3 88.6 216.3 85.6 215.6 Z" fill="#5a3714"/>
    <path d="M85.8 214.9 C83.4 214.1 83.5 211 85.4 210.4 L96.2 210.4 C97.9 211.1 98 213.9 95.5 214.9 C92.6 215.6 88.6 215.6 85.8 214.9 Z" fill="url(#mouse_fmt-poopBot)"/>
    <path d="M87 209.8 C85.8 209.2 86 207.2 87.8 206.6 L95.1 206.6 C96.5 207.2 96.5 209.2 95.4 209.8 Z" fill="url(#mouse_fmt-poopMid)"/>
    <path d="M88.6 206 C89 204.7 90.8 203.5 92.3 203 C92.9 202.7 93.2 202.4 93.4 202.1 C94.6 202.8 94.8 204.4 94.7 206 Z" fill="url(#mouse_fmt-poopTop)"/>
    <ellipse cx="87.6" cy="212" rx="2.4" ry="1.1" fill="url(#mouse_fmt-poopHi)"/>
    <ellipse cx="89" cy="208" rx="2" ry="0.9" fill="url(#mouse_fmt-poopHi)" opacity="0.7"/>
    <ellipse cx="93.4" cy="202.3" rx="0.8" ry="0.6" fill="#4a2c12"/>
  </g>

  <!-- arrow -->
  <g id="mouse_fmt-arrow" fill="#1d2433">
    <path d="M98.57 200.30 L99.25 199.49 L99.97 198.72 L100.74 197.97 L101.55 197.25 L102.40 196.56 L103.30 195.91 L104.24 195.31 L105.22 194.74 L106.24 194.22 L107.31 193.76 L108.42 193.34 L109.57 192.99 L110.75 192.69 L111.98 192.42 L113.25 192.22 L114.56 192.10 L115.53 192.07 L116.49 192.08 L117.42 192.14 L118.33 192.24 L119.22 192.37 L120.09 192.55 L120.93 192.76 L121.75 193.00 L122.55 193.27 L123.32 193.56 L124.06 193.89 L124.78 194.24 L125.47 194.61 L126.13 195.00 L126.77 195.41 L127.38 195.84 L128.42 194.36 L127.77 193.91 L127.07 193.46 L126.35 193.04 L125.60 192.63 L124.81 192.25 L124.00 191.90 L123.16 191.57 L122.30 191.28 L121.40 191.02 L120.48 190.79 L119.54 190.60 L118.57 190.45 L117.57 190.35 L116.55 190.28 L115.51 190.27 L114.44 190.30 L113.02 190.44 L111.65 190.65 L110.32 190.94 L109.05 191.32 L107.83 191.77 L106.66 192.28 L105.55 192.84 L104.48 193.46 L103.47 194.12 L102.50 194.83 L101.59 195.57 L100.73 196.34 L99.93 197.15 L99.17 197.98 L98.47 198.84 L97.83 199.70 Z"/>
    <circle cx="98.2" cy="200.0" r="0.47"/>
    <path d="M131.7 198.7 L129.9 192.3 L125.3 196.9 Z" stroke="#1d2433" stroke-width="0.3" stroke-linejoin="round"/>
  </g>

  <!-- tail -->
  <path id="mouse_fmt-tail" d="M115.4 210.8 C110.6 210.3 105 210.5 101.9 212.3 C99.5 213.9 99.8 217.9 102.7 219.7 C105 221 107.8 221.3 111 221.2 L111.2 220.1 C108 219.9 105.8 219.5 104.2 218.4 C102.6 217.4 102.6 215.4 104.4 214.4 C106.2 213.4 110.4 213.4 114.6 214.8 Z" fill="url(#mouse_fmt-tailG)"/>

  <!-- legs and feet -->
  <g id="mouse_fmt-legs">
    <path d="M117.4 217 C117.8 218.4 119.6 218.9 121.6 219.1 C123 219.4 123.8 220.2 125 220.2 C126.4 220.2 126.6 219 125.8 218.2 C125 217.4 122.6 217 120 216.6 Z" fill="#8a7a80"/>
    <ellipse cx="136.2" cy="219.2" rx="2.1" ry="1" fill="#8a848e" transform="rotate(8 136.2 219.2)"/>
    <ellipse cx="138.6" cy="216.7" rx="2" ry="0.95" fill="#9a949a"/>
    <path d="M117.4 215.4 C117.2 217 117.8 218 119.4 218.2 C121.6 218.4 124 218.2 125.6 217.4 L125.6 216.2 Z" fill="#3c3739"/>
    <path d="M130.2 216.2 C130.6 217.6 131.8 218.6 133.4 219 C134.4 219.2 135 218.4 134.6 217.6 L134.2 216.2 Z" fill="#333034"/>
  </g>

  <!-- body -->
  <path id="mouse_fmt-body" d="M115.1 213.6 C115.3 208.9 118.2 204.4 123.2 202.2 C126.4 200.9 130.4 200.7 133.6 201.6 C137 202.4 139.6 202.2 141.6 203.2 C144.2 204.6 146.6 207.2 148.4 209.4 C149.2 210.4 148.6 211.6 147.4 212.2 C146 212.9 143.6 213.1 141.6 213.3 C140 213.6 139 214.4 138.3 215.6 C137 216.6 135 216.8 133 216.9 C129 217.1 124 217.1 120 216.9 C117 216.6 115.2 215.2 115.1 213.6 Z" fill="url(#mouse_fmt-bodyG)" stroke="#38353a" stroke-width="0.55"/>
  <ellipse cx="127" cy="205.4" rx="7.5" ry="3.6" fill="url(#mouse_fmt-bodyHi)"/>

  <!-- ear -->
  <path id="mouse_fmt-earOuter" d="M134.6 204.6 C134.4 202.6 135 200.6 136.6 199.6 C137.8 198.8 139.6 198.7 140.6 199.7 C141.6 200.6 142 202 141.8 203.6 C141 205.4 139.4 206.4 137.6 206.6 C136.2 206.8 134.8 206 134.6 204.6 Z" fill="#4e4c54"/>
  <path id="mouse_fmt-earIn" d="M134 205 C133.5 203.2 134.1 201.2 135.6 200.6 C137.1 200.1 138.3 201.2 138.3 203 C138.3 204.9 137.5 206.4 136.2 206.8 C135.2 207 134.3 206.2 134 205 Z" fill="#6c4252"/>
  <ellipse id="mouse_fmt-ear" cx="135.5" cy="203.3" rx="1.35" ry="2.15" transform="rotate(12 135.5 203.3)" fill="url(#mouse_fmt-earG)"/>

  <!-- eye / nose -->
  <ellipse cx="142.4" cy="207.4" rx="0.85" ry="0.75" fill="#18161a"/>
  <ellipse cx="147.4" cy="210.5" rx="0.85" ry="0.65" fill="#3a2f36"/>

  <!-- dropper -->
  <g id="mouse_fmt-dropper" transform="translate(141.1 201.6) rotate(-43)">
    <path d="M0 -0.45 L5.8 -0.8 L5.8 0.8 L0 0.45 Z" fill="#8094a8"/>
    <rect x="5.5" y="-1.85" width="13.4" height="3.7" rx="0.9" fill="url(#mouse_fmt-barrelG)" stroke="#7f98ae" stroke-width="0.35"/>
    <rect x="5.7" y="-1.65" width="6.6" height="3.3" rx="0.7" fill="url(#mouse_fmt-liqG)"/>
    <rect x="18.3" y="-3.1" width="2.6" height="6.2" rx="1.1" fill="url(#mouse_fmt-flangeG)"/>
    <path d="M20.6 -2.9 C23.8 -3.4 26.6 -2.6 26.8 0 C26.6 2.6 23.8 3.4 20.6 2.9 Z" fill="url(#mouse_fmt-bulbG)"/>
  </g>
</g>
