  <g id="mouse_fmt-legs">
    <path d="M117.3 217 C117.4 218.4 118.8 219 121.4 219.2 C122.8 219.4 123.8 220.2 125 220.2 C126.4 220.2 126.6 219 125.8 218.2 C125 217.4 122.6 217 120 216.6 Z" fill="#978790"/>
    <ellipse cx="136.2" cy="219.2" rx="2.1" ry="1" fill="#8a848e" transform="rotate(8 136.2 219.2)"/>
    <ellipse cx="138.6" cy="216.7" rx="2" ry="0.95" fill="#9a949a"/>
    <path d="M117.4 215.4 C117.2 217 117.8 218 119.4 218.2 C121.6 218.4 124 218.2 125.6 217.4 L125.6 216.2 Z" fill="#433d40"/>
    <path d="M130.2 216.2 C130.6 217.6 131.8 218.6 133.4 219 C134.4 219.2 135 218.4 134.6 217.6 L134.2 216.2 Z" fill="#4a4448"/>
  </g>

  <!-- body -->
  <path id="mouse_fmt-body" d="M115.1 213.6 C115.3 208.9 118.2 204.4 123.2 202.2 C126.4 200.7 130.4 200.5 133.6 201.5 C137 202.4 139.6 202.2 141.6 203.2 C144.2 204.6 146.6 207.2 148.4 209.4 C149.1 210.3 148.6 211.3 147.4 211.9 C146.2 212.6 144.4 212.9 141.6 213.0 C140.2 213.2 138.8 214 137.6 215.6 C137 216.6 135 216.8 133 216.9 C129 217.3 124 217.3 120 217 C117 216.6 115.2 215.2 115.1 213.6 Z" fill="url(#mouse_fmt-bodyG)" stroke="#423f45" stroke-width="0.4"/>
  <path d="M119.2 208 C120.2 205.6 122.4 204 125 203.3 C127.6 202.7 130.4 202.8 132.4 203.3" fill="none" stroke="#7c8086" stroke-width="0.9" stroke-linecap="round" opacity="0.55" filter="url(#mouse_fmt-soft)"/>

  <ellipse cx="120.6" cy="210.4" rx="2.4" ry="3.6" fill="#7a7c80" opacity="0.32" filter="url(#mouse_fmt-soft2)"/>
  <ellipse cx="131.6" cy="211.2" rx="1.6" ry="2.6" fill="#7a7c80" opacity="0.3" filter="url(#mouse_fmt-soft2)"/>

  <path d="M115.3 213 C115.2 208.9 118.2 204.4 123.2 202.2 C126.4 200.7 130.4 200.5 133.6 201.5" fill="none" stroke="#2e2c31" stroke-width="0.75" stroke-linecap="round" opacity="0.85"/>

  <!-- ear -->
  <path id="mouse_fmt-earOuter" d="M135.2 202.6 C135.4 201 136.6 199.6 138.2 199 C139.6 198.6 141 199.4 141.6 200.8 C142.1 202.2 141.8 203.6 140.8 204.6 C139.6 205.8 137.6 206.6 136.2 206.4 C135.2 205.6 135 204 135.2 202.6 Z" fill="#4e4c54"/>
  <path id="mouse_fmt-earIn" d="M133.6 204.6 C133.2 202.6 134.2 200.6 135.8 200.2 C137.4 199.9 138.4 201.4 138.2 203.4 C138 205.2 137.2 206.6 135.8 206.9 C134.8 207 133.9 206 133.6 204.6 Z" fill="#74485a"/>
  <ellipse id="mouse_fmt-ear" cx="135.5" cy="203.4" rx="1.6" ry="2.45" transform="rotate(14 135.5 203.4)" fill="url(#mouse_fmt-earG)"/>

  <!-- eye / nose -->
  <ellipse cx="142.4" cy="207.3" rx="0.7" ry="0.65" fill="#211e24"/>
  <ellipse cx="147.9" cy="210.4" rx="0.75" ry="0.6" fill="#8a6c78"/>

  <!-- dropper -->
  <g id="mouse_fmt-dropper" transform="translate(141.1 201.6) rotate(-43)">
    <path d="M0 -0.4 L5.8 -0.95 L5.8 0.95 L0 0.4 Z" fill="url(#mouse_fmt-tipG)"/>
    <rect x="5.5" y="-2" width="13.4" height="4" rx="1" fill="url(#mouse_fmt-barrelG)" stroke="#748ca2" stroke-width="0.35"/>
    <rect x="5.7" y="-1.8" width="5.2" height="3.6" rx="0.8" fill="url(#mouse_fmt-liqG)"/>
    <rect x="18.4" y="-3.4" width="2.8" height="6.3" rx="1.2" fill="url(#mouse_fmt-flangeG)"/>
    <rect x="20.6" y="-3.4" width="6.4" height="6.3" rx="2.7" fill="url(#mouse_fmt-bulbG)"/>
    <ellipse cx="22.9" cy="-1.5" rx="1.5" ry="0.9" fill="#a8c4f0" opacity="0.55" filter="url(#mouse_fmt-soft)"/>
  </g>
</g>
