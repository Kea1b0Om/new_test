<g id="mouse_fmt">
  <defs>
    <filter id="mouse_fmt-glow" filterUnits="userSpaceOnUse" x="70" y="186" width="96" height="42">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="mouse_fmt-soft" x="-0.3" y="-0.3" width="1.6" height="1.6">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <filter id="mouse_fmt-soft2" x="-0.6" y="-0.6" width="2.2" height="2.2">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <linearGradient id="mouse_fmt-poopBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#744610"/>
      <stop offset="0.38" stop-color="#8c6230"/>
      <stop offset="0.66" stop-color="#6e4a22"/>
      <stop offset="1" stop-color="#4c2c14"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-poopMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e4a24"/>
      <stop offset="0.45" stop-color="#7c4414"/>
      <stop offset="1" stop-color="#8a561e"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-poopTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6250"/>
      <stop offset="0.5" stop-color="#a87e66"/>
      <stop offset="1" stop-color="#8e5c34"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-poopSil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#664016"/>
      <stop offset="0.86" stop-color="#5e3a16"/>
      <stop offset="1" stop-color="#7a6256"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-poopShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.55" stop-color="#3a2008" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2008" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="mouse_fmt-poopHi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c49a62" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c49a62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mouse_fmt-bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6167"/>
      <stop offset="0.55" stop-color="#5c5a5d"/>
      <stop offset="0.78" stop-color="#4c484b"/>
      <stop offset="1" stop-color="#2e2a2d"/>
    </linearGradient>
    <radialGradient id="mouse_fmt-bodyHi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a7e80" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7a7e80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mouse_fmt-earG" cx="0.42" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#df9fb1"/>
      <stop offset="0.5" stop-color="#c38597"/>
      <stop offset="1" stop-color="#8e5a6c"/>
    </radialGradient>
    <linearGradient id="mouse_fmt-tailG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b2a3ab"/>
      <stop offset="0.6" stop-color="#9a8c97"/>
      <stop offset="1" stop-color="#a59aa2"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-tailRoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a4e56" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a4e56" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-barrelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94b6cc"/>
      <stop offset="0.35" stop-color="#e2f4ff"/>
      <stop offset="0.7" stop-color="#c6dbea"/>
      <stop offset="1" stop-color="#6f879c"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-tipG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a2b2c2"/>
      <stop offset="1" stop-color="#76899e"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-liqG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6d6ea"/>
      <stop offset="0.5" stop-color="#6aa2bc"/>
      <stop offset="1" stop-color="#3c6a84"/>
    </linearGradient>
    <linearGradient id="mouse_fmt-flangeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5e92"/>
      <stop offset="0.45" stop-color="#4a689c"/>
      <stop offset="1" stop-color="#1f3254"/>
    </linearGradient>
    <radialGradient id="mouse_fmt-bulbG" cx="0.32" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#7a9fdc"/>
      <stop offset="0.45" stop-color="#456db2"/>
      <stop offset="1" stop-color="#1a3260"/>
    </radialGradient>
  </defs>

  <!-- soft whitish halos (the original vignette icons sit on faint white glows) -->
  <g filter="url(#mouse_fmt-glow)" opacity="0.8">
    <ellipse cx="87" cy="206" rx="6.5" ry="6" fill="#fff2d2"/>
    <ellipse cx="107" cy="215" rx="6.5" ry="4.5" fill="#fdf6fb"/>
    <ellipse cx="129" cy="218.6" rx="13" ry="3" fill="#faf3f8"/>
  </g>

  <!-- poop -->
