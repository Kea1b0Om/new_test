    <path d="M85.8 214.9 C83.4 214.1 83.5 211 85.4 210.4 L96.2 210.4 C97.9 211.1 98 213.9 95.5 214.9 C92.6 215.6 88.6 215.6 85.8 214.9 Z" fill="url(#mouse_fmt-poopBot)"/>
    <path d="M87 209.8 C85.8 209.2 86 207.2 87.8 206.6 L95.1 206.6 C96.5 207.2 96.5 209.2 95.4 209.8 Z" fill="url(#mouse_fmt-poopMid)"/>
    <path d="M88.6 206 C89 204.7 90.8 203.5 92.3 203 C92.9 202.7 93.2 202.4 93.4 202.1 C94.6 202.8 94.8 204.4 94.7 206 Z" fill="url(#mouse_fmt-poopTop)"/>
    <ellipse cx="87.6" cy="212" rx="2.4" ry="1.1" fill="url(#mouse_fmt-poopHi)"/>
    <ellipse cx="89" cy="208" rx="2" ry="0.9" fill="url(#mouse_fmt-poopHi)" opacity="0.7"/>
    <ellipse cx="93.4" cy="202.3" rx="0.8" ry="0.6" fill="#4a2c12"/>
    <path d="M85.6 215.6 C82.4 214.8 82.4 210.8 84.8 209.9 L85.9 209.7 C85.1 208.4 85.5 206.6 87.6 206.1 L88.1 205.9 C88.6 204.5 90.6 203.1 92.2 202.6 C92.9 202.3 93.2 201.9 93.4 201.6 C95 202.1 95.4 204 95.2 205.9 L95.6 206.1 C97.2 206.8 97.2 209 96.4 209.8 L96.8 209.9 C98.8 210.8 98.9 214 95.6 215.6 C92.6 216.3 88.6 216.3 85.6 215.6 Z" fill="url(#mouse_fmt-poopShade)"/>
  </g>

