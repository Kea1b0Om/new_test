      <stop offset="0.25" stop-color="#f4d8a6"/>
      <stop offset="0.55" stop-color="#fbcf94"/>
      <stop offset="0.85" stop-color="#f9c98c"/>
      <stop offset="1" stop-color="#f2c385"/>
    </linearGradient>

    <clipPath id="bowl-cInner">
      <ellipse cx="348" cy="13.4" rx="33" ry="9.7" transform="rotate(-0.6 348 13.4)"/>
    </clipPath>
    <clipPath id="bowl-cBody">
      <path d="M311.8,13 C312.4,26.5 319,38.2 330.2,42.3 L365.4,42.3 C376.6,38.2 383.2,26.5 383.8,12.3 Z"/>
    </clipPath>
  </defs>

  <!-- ===== BOWL ===== -->
  <!-- soft shadow under the foot -->
  <ellipse cx="348" cy="45" rx="22" ry="1.6" fill="#5f7682" opacity="0.45" filter="url(#bowl-b08)"/>

  <!-- body -->
  <path d="M311.8,13 C312.4,26.5 319,38.2 330.2,42.3 L365.4,42.3 C376.6,38.2 383.2,26.5 383.8,12.3 Z" fill="url(#bowl-body)"/>
  <g clip-path="url(#bowl-cBody)">
    <rect x="310" y="12" width="76" height="32" fill="url(#bowl-bodyV)"/>
    <!-- soft highlight -->
    <path d="M325,25.5 C330,26 333.5,30 334,35 C334.3,38 332,39.5 329,37.5 C326,35 324.5,30 325,25.5 Z" fill="#f2f6f5" opacity="0.55" filter="url(#bowl-b15)"/>
    <!-- shading along left contour -->
    <path d="M312.6,14 C313.2,26.5 319.5,37.5 330.5,41.8" fill="none" stroke="#9eacab" stroke-width="2.2" opacity="0.55" filter="url(#bowl-b08)"/>
    <!-- greyish-olive reflection from the herbs on the right -->
