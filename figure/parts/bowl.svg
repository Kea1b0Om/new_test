  <!-- P3: front-left slice -->
  <path d="M356.4,45.6 C356.2,43.6 356.6,41.8 357.8,40.6 C359.2,39.4 361,38.6 362.6,37.4 C364,36.4 365.2,35.2 366,34.2 C367,33.3 368.6,32.9 371,32.8 C375,32.6 380,32.5 383.6,32.9 C386.2,33.4 388.4,35 390,36.8 C391.2,38.1 392.3,39 393.8,39.6 C389,40 384,40.5 380,41.5 C376,42.6 372,44 368.6,45.8 C364,46.2 360,46.1 356.4,45.6 Z" fill="url(#bowl-p3)"/>
  <!-- bark under P3 -->
  <path d="M368.2,45.9 C371.6,44.4 375.4,42.8 379.4,41.5 C384,40.2 388.6,39.7 393.9,39.4 L393.4,41.2 C390.8,41.8 388.6,42.6 386.8,43.6 C384.6,44.8 381.6,45.6 377.6,46 Z" fill="#5c4530"/>
  <path d="M369,45.4 C373,43.6 377.5,42 382,41" fill="none" stroke="#3e2a14" stroke-width="0.8" opacity="0.7" filter="url(#bowl-b03)"/>
  <!-- P3 top-left edge -->
  <path d="M356.6,44.6 C356.4,42.6 357,41.4 358.4,40.3 C359.8,39.2 361.6,38.3 363,37.2 C364.4,36.1 365.3,35 366.2,34" fill="none" stroke="#7d7356" stroke-width="1" opacity="0.85" filter="url(#bowl-b03)"/>
  <ellipse cx="364.6" cy="36.6" rx="1.4" ry="0.9" fill="#6d5634" opacity="0.7" filter="url(#bowl-b03)"/>
