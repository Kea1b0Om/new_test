    <path d="M318,22 C328,26.2 340,26.8 350,26.6 C361,26.4 371,24.4 380,20" fill="none" stroke="#9fb0b0" stroke-width="1.2" opacity="0.35" filter="url(#bowl-b05)"/>
  </g>
  <!-- foot ring -->
