<g id="bowl">
  <defs>
    <filter id="bowl-b03" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.3"/></filter>
    <filter id="bowl-b05" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.5"/></filter>
    <filter id="bowl-b08" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0.8"/></filter>
    <filter id="bowl-b15" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>

    <!-- bowl body: white ceramic, light on the left, grey-teal shade to the right -->
    <linearGradient id="bowl-body" gradientUnits="userSpaceOnUse" x1="312" y1="0" x2="384" y2="0">
      <stop offset="0" stop-color="#c3cecc"/>
      <stop offset="0.08" stop-color="#cdd7d5"/>
      <stop offset="0.17" stop-color="#dbe3e1"/>
      <stop offset="0.24" stop-color="#e6ecea"/>
      <stop offset="0.3" stop-color="#e1e9e7"/>
      <stop offset="0.36" stop-color="#d4e1df"/>
      <stop offset="0.45" stop-color="#cbd9d8"/>
      <stop offset="0.53" stop-color="#c3d1d0"/>
      <stop offset="0.61" stop-color="#b5c5c4"/>
      <stop offset="0.69" stop-color="#a1b5b3"/>
      <stop offset="0.78" stop-color="#90a6a4"/>
      <stop offset="0.86" stop-color="#83999a"/>
      <stop offset="1" stop-color="#7e9395"/>
    </linearGradient>
    <linearGradient id="bowl-bodyV" gradientUnits="userSpaceOnUse" x1="0" y1="25" x2="0" y2="43">
      <stop offset="0" stop-color="#4f707a" stop-opacity="0.06"/>
      <stop offset="0.35" stop-color="#4f707a" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#4f707a" stop-opacity="0.04"/>
      <stop offset="0.8" stop-color="#4f707a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#46646f" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="bowl-foot" gradientUnits="userSpaceOnUse" x1="0" y1="41.8" x2="0" y2="45.6">
      <stop offset="0" stop-color="#93a6ad"/>
      <stop offset="0.5" stop-color="#8396a0"/>
      <stop offset="1" stop-color="#6d838e"/>
    </linearGradient>
    <!-- rim top surface -->
    <linearGradient id="bowl-rim" gradientUnits="userSpaceOnUse" x1="312" y1="0" x2="384" y2="0">
      <stop offset="0" stop-color="#bccac7"/>
      <stop offset="0.12" stop-color="#cbd6d3"/>
      <stop offset="0.35" stop-color="#d7dfdb"/>
      <stop offset="0.6" stop-color="#dfe5e0"/>
      <stop offset="0.85" stop-color="#eef2ef"/>
      <stop offset="1" stop-color="#f3f6f4"/>
    </linearGradient>
    <!-- inner wall: grey-green on the left to cream on the right -->
    <linearGradient id="bowl-wall" gradientUnits="userSpaceOnUse" x1="315" y1="0" x2="381" y2="0">
      <stop offset="0" stop-color="#87938a"/>
      <stop offset="0.12" stop-color="#8f998f"/>
      <stop offset="0.24" stop-color="#a6aea8"/>
      <stop offset="0.38" stop-color="#bdbfb6"/>
      <stop offset="0.53" stop-color="#d7d2c2"/>
      <stop offset="0.68" stop-color="#eee5d4"/>
      <stop offset="0.84" stop-color="#efe9de"/>
      <stop offset="1" stop-color="#e3e0d8"/>
