    <!-- warm glow of the decoction on the wall -->
    <path d="M321,13.6 C326,10.4 336,8.6 348,8.4 C362,8.3 372,10.4 377,14.4" fill="none" stroke="url(#bowl-glowG)" stroke-width="3.2" filter="url(#bowl-b08)"/>
    <!-- decoction -->
    <path d="M319,16.3 C321,12.7 333,9.1 348,9 C363,9 374.4,11.6 377.6,15.7 C375,19.1 363,22.9 348,23.1 C333,23.1 321.4,20.1 319,16.3 Z" fill="url(#bowl-liq)"/>
    <path d="M319,16.3 C321,12.7 333,9.1 348,9 C363,9 374.4,11.6 377.6,15.7 C375,19.1 363,22.9 348,23.1 C333,23.1 321.4,20.1 319,16.3 Z" fill="url(#bowl-liqR)"/>
    <!-- darker left part of the liquid -->
    <ellipse cx="329" cy="17.2" rx="8" ry="3" fill="#3a1a04" opacity="0.45" filter="url(#bowl-b08)"/>
