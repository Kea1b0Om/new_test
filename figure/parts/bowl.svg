  <path d="M362,45.6 C372,44.6 390,43.6 405,43.4 C410,43.4 412,44.4 411,45.6 Z" fill="#6c625a" opacity="0.55" filter="url(#bowl-b08)"/>
  <ellipse cx="392.6" cy="43.8" rx="5" ry="1.2" fill="#b4b6c0" opacity="0.8" filter="url(#bowl-b05)"/>

  <!-- P1: back brown slice -->
  <path d="M380.6,23.5 C381.5,21.5 384,20 386.8,19.3 C389,18.8 390.8,17.5 392.5,17.6 C393.8,17.8 394.4,19.1 396.2,19.3 C398.6,19.5 400.6,18.7 402.2,17.4 C403.4,16.6 404.3,17.4 404.9,19 C405.7,21.3 406.5,24.4 406.3,26.8 C406.1,28.4 404.6,29.2 402.5,29.1 L384,28.6 C382,27.6 380.4,25.6 380.6,23.5 Z" fill="url(#bowl-p1)"/>
  <ellipse cx="392" cy="21.8" rx="5.5" ry="1.8" fill="#b07c4c" opacity="0.7" filter="url(#bowl-b08)"/>
  <ellipse cx="398.5" cy="25.2" rx="6" ry="1.8" fill="#46200a" opacity="0.65" filter="url(#bowl-b08)"/>
  <path d="M381,22.4 C383.5,20.2 386.5,19.3 389,18.8 C390.5,18.4 391.5,17.6 392.6,17.8 C393.7,18 394.4,19.3 396.2,19.5 C398.6,19.7 400.6,18.8 402.3,17.5" fill="none" stroke="#5a3414" stroke-width="0.9" opacity="0.75" filter="url(#bowl-b03)"/>
  <path d="M403.4,17.3 C404.8,19.5 405.9,23.4 405.8,27.6" fill="none" stroke="#4a2a10" stroke-width="1.2" opacity="0.7" filter="url(#bowl-b03)"/>

  <!-- P2: big pale slice -->
  <path d="M378.8,32 C378.6,29.8 379.6,27.6 381.4,26.6 C383.4,25.8 385.6,25.6 387.6,25.9 C390.5,26.3 393.5,27.3 396.5,28 C399.5,28.6 402.5,28.9 405.5,29.1 C409.5,29.4 413.5,29.8 416.6,30.1 C417.6,30.2 418.2,30.6 417.9,31.4 C417.4,33.6 416.4,35.4 414.6,36.7 C412.9,37.8 410.9,38.2 409.9,39.2 C409.4,40.4 409.9,42 409.4,43.2 C406,44 401,44.3 397,43.6 L392,42 L380,41 Z" fill="url(#bowl-p2)"/>
  <!-- lower shading near the crease -->
  <ellipse cx="394" cy="37.6" rx="4" ry="2" fill="#c48f58" opacity="0.6" filter="url(#bowl-b08)"/>
  <ellipse cx="401.8" cy="34.7" rx="1.1" ry="0.8" fill="#b9874f" opacity="0.8" filter="url(#bowl-b03)"/>
  <!-- top edge soft line -->
  <path d="M386,26 C390,26.5 394,27.6 398,28.4 C403,29 410,29.5 416.4,30.1" fill="none" stroke="#c99a62" stroke-width="0.6" opacity="0.6" filter="url(#bowl-b03)"/>
  <!-- right curled bark edge -->
  <path d="M407.5,37.4 C410,37.2 412.6,36.6 414.4,35.4 C415.8,34.2 416.3,33.4 416.8,32.6 L417.7,31.2 C417.3,33.8 416.1,35.8 414.2,37.2 C412.5,38.4 410.6,38.8 409.8,39.6 Z" fill="#5f3d1f"/>
  <path d="M417.6,30.7 C417.2,33.4 416,35.5 414,36.9 C412.4,38 410.6,38.5 409.8,39.6 L409.7,42.8" fill="none" stroke="#583718" stroke-width="1.5" stroke-linecap="round" filter="url(#bowl-b03)"/>
  <!-- bark under P2 -->
  <path d="M391,39.4 C395.5,40 400.5,40.7 404.5,40.5 C406.8,40.3 408.5,39.8 409.7,39.2 L409.9,43.2 C406.5,44 402,44.4 398,43.8 C395.5,43.3 393.2,42.5 390.6,41.8 Z" fill="#6a4c27"/>
  <path d="M398,43.7 C402,44.2 406.5,43.9 409.8,43.1" fill="none" stroke="#4a3418" stroke-width="0.9" opacity="0.8"/>
  <!-- left end tucked behind the bowl -->
