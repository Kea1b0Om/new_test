    <linearGradient id="bowl-glowG" gradientUnits="userSpaceOnUse" x1="318" y1="0" x2="378" y2="0">
      <stop offset="0" stop-color="#a99a78" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#b79d6c" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#d9ab62" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#f0c98c" stop-opacity="0.9"/>
      <stop offset="0.9" stop-color="#f1d3ad" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ecd8bf" stop-opacity="0.3"/>
    </linearGradient>
    <!-- decoction -->
    <linearGradient id="bowl-liq" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="23">
      <stop offset="0" stop-color="#9a5f1d"/>
      <stop offset="0.12" stop-color="#8a5115"/>
      <stop offset="0.35" stop-color="#6a3709"/>
      <stop offset="0.55" stop-color="#532503"/>
      <stop offset="0.8" stop-color="#481d03"/>
      <stop offset="1" stop-color="#462414"/>
    </linearGradient>
    <radialGradient id="bowl-liqR" gradientUnits="userSpaceOnUse" cx="364" cy="12.6" r="14" gradientTransform="translate(364 12.6) scale(1 0.36) translate(-364 -12.6)">
      <stop offset="0" stop-color="#b8711f" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#a8641b" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8f4f14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowl-outl" gradientUnits="userSpaceOnUse" x1="312" y1="0" x2="384" y2="0">
      <stop offset="0" stop-color="#8f9b99"/>
      <stop offset="0.25" stop-color="#a5afac"/>
      <stop offset="0.5" stop-color="#b8c0bc"/>
      <stop offset="0.75" stop-color="#b0b9b6"/>
      <stop offset="1" stop-color="#9aa6a4"/>
    </linearGradient>
    <linearGradient id="bowl-lipL" gradientUnits="userSpaceOnUse" x1="315" y1="0" x2="356" y2="0">
      <stop offset="0" stop-color="#7f8b86" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#8f9993" stop-opacity="0.8"/>
      <stop offset="0.8" stop-color="#b0b4ab" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c0c3bb" stop-opacity="0"/>
    </linearGradient>

    <!-- herbs -->
    <linearGradient id="bowl-p1" gradientUnits="userSpaceOnUse" x1="384" y1="19" x2="402" y2="28">
      <stop offset="0" stop-color="#8a6446"/>
      <stop offset="0.35" stop-color="#8e5c2e"/>
      <stop offset="0.65" stop-color="#6a3a10"/>
      <stop offset="1" stop-color="#4f2807"/>
    </linearGradient>
    <linearGradient id="bowl-p2" gradientUnits="userSpaceOnUse" x1="379" y1="0" x2="418" y2="0">
      <stop offset="0" stop-color="#76502a"/>
      <stop offset="0.08" stop-color="#a7743c"/>
      <stop offset="0.2" stop-color="#e6b072"/>
      <stop offset="0.38" stop-color="#ffd194"/>
      <stop offset="0.65" stop-color="#f9cc92"/>
      <stop offset="0.9" stop-color="#f5cf9e"/>
      <stop offset="1" stop-color="#eccda4"/>
    </linearGradient>
    <linearGradient id="bowl-p3" gradientUnits="userSpaceOnUse" x1="360" y1="45" x2="388" y2="33">
