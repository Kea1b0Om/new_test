    <path d="M330,11.2 C337,9.9 346,9.6 354,9.9" fill="none" stroke="#a8702c" stroke-width="0.8" opacity="0.5" filter="url(#bowl-b03)"/>
  </g>
  <!-- inner lip line (visible on the left/top) -->
  <path d="M318.6,16.4 C315.6,14.6 314.8,12 316.6,9.8 C319,7.2 324.5,5.4 331,4.4 C338,3.6 346,3.4 356,3.8" fill="none" stroke="url(#bowl-lipL)" stroke-width="0.9"/>
  <!-- white front rim surface -->
  <path d="M316.6,16.6 C319,18.4 322.5,19.9 327,21.1 C332.5,22.4 339,23.3 347,23.6 C355,23.6 362,22.6 367.5,21 C371.5,19.8 374.5,18.4 376.6,17" fill="none" stroke="#f7f9f6" stroke-width="1.35" opacity="0.95"/>
  <!-- left rim highlight -->
  <path d="M313.7,8.6 C312.9,10.6 312.9,13.2 313.6,15.4 C314.2,16.6 315.2,17.4 316.2,17.6" fill="none" stroke="#f6f9f8" stroke-width="1.1" opacity="0.9"/>
  <!-- right rim highlight -->
  <path d="M378,6.8 C380.6,8.4 382,10.4 382.1,12.6 C382.1,14 381.2,15.4 380,16.4" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
  <!-- outer rim outline -->
  <path d="M311.6,13.4 C311.2,5.4 328,0.6 348,0.7 C367,0.8 383.6,5.4 383.7,12.6" fill="none" stroke="url(#bowl-outl)" stroke-width="0.9"/>
  <!-- faint outer edge along the front -->
  <path d="M330,24 C337,25.1 344,25.4 351,25.3" fill="none" stroke="#b4c1c0" stroke-width="0.7" opacity="0.6"/>

