  <path d="M330.6,41.8 L330.8,45.6" stroke="#5e6f78" stroke-width="0.9" fill="none"/>
  <path d="M331,42.2 C340,42.9 356,42.9 365,42.2" stroke="#a9bac0" stroke-width="0.5" fill="none" opacity="0.6"/>
  <!-- body outlines -->
  <path d="M311.8,13 C312.4,26.5 319,38.2 330.4,42.2" fill="none" stroke="#97a3a1" stroke-width="0.95"/>
  <path d="M383.8,12.3 C383.2,26.5 376.6,38.2 365.4,42.2" fill="none" stroke="#7d8f90" stroke-width="0.9"/>

